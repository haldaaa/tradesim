<!DOCTYPE html>
<html>
<head>
    <title>Test WebSocket</title>
</head>
<body>
    <h1>Test WebSocket TradeSim</h1>
    <div id="status">En attente...</div>
    <div id="messages"></div>
    
    <script>
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');
        
        function addMessage(msg) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ': ' + msg;
            messages.appendChild(div);
        }
        
        try {
            const ws = new WebSocket('ws://localhost:8000/ws');
            
            ws.onopen = function() {
                status.textContent = 'WebSocket connecté !';
                addMessage('Connexion établie');
                ws.send(JSON.stringify({type: 'ping'}));
            };
            
            ws.onmessage = function(event) {
                addMessage('Message reçu: ' + event.data);
            };
            
            ws.onerror = function(error) {
                status.textContent = 'Erreur WebSocket';
                addMessage('Erreur: ' + error);
            };
            
            ws.onclose = function() {
                status.textContent = 'WebSocket fermé';
                addMessage('Connexion fermée');
            };
            
        } catch (error) {
            status.textContent = 'Erreur de connexion';
            addMessage('Erreur: ' + error.message);
        }
    </script>
</body>
</html>
