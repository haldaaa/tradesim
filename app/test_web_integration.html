<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Integration Web - TradeSim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>🧪 Test Integration Web - TradeSim</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>🔗 Test API</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testAPI()">Test API Health</button>
                        <button class="btn btn-secondary" onclick="testConfig()">Test Config</button>
                        <div id="api-result" class="mt-3"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>🌐 Test WebSocket</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="testWebSocket()">Test WebSocket</button>
                        <div id="websocket-result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>🚀 Test Simulation</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-warning" onclick="testSimulation()">Test Simulation</button>
                        <div id="simulation-result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                resultDiv.innerHTML = `<div class="alert alert-success">✅ API OK: ${data.status}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ API Error: ${error.message}</div>`;
            }
        }
        
        async function testConfig() {
            const resultDiv = document.getElementById('api-result');
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                resultDiv.innerHTML = `<div class="alert alert-success">✅ Config OK: ${Object.keys(data.config).length} paramètres</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Config Error: ${error.message}</div>`;
            }
        }
        
        function testWebSocket() {
            const resultDiv = document.getElementById('websocket-result');
            try {
                const ws = new WebSocket('ws://localhost:8000/ws');
                
                ws.onopen = () => {
                    resultDiv.innerHTML = `<div class="alert alert-success">✅ WebSocket connecté</div>`;
                    ws.send(JSON.stringify({ type: 'ping' }));
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    resultDiv.innerHTML = `<div class="alert alert-info">📨 Message reçu: ${data.type}</div>`;
                    ws.close();
                };
                
                ws.onerror = (error) => {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ WebSocket Error: ${error}</div>`;
                };
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ WebSocket Error: ${error.message}</div>`;
            }
        }
        
        async function testSimulation() {
            const resultDiv = document.getElementById('simulation-result');
            try {
                const response = await fetch('/api/simulation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tours: 1,
                        verbose: true,
                        with_metrics: true
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<div class="alert alert-success">✅ Simulation OK: ${data.status}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ Simulation Error: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Simulation Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
